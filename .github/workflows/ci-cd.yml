name: Garcar — Deploy & Ops

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_DEPLOY_PAGE_ID: ${{ secrets.NOTION_DEPLOY_PAGE_ID }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

jobs:
  lint-and-test:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest tests/ -x --tb=short

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Railway Deploy
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"serviceId\": \"$RAILWAY_SERVICE_ID\"}" \
            https://backboard.railway.app/graphql/v2

  health-check:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for Railway to come up
        run: sleep 30
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://your-service.railway.app/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed — HTTP $STATUS"
            exit 1
          fi
          echo "✅ Service healthy"

  notify:
    name: Notify Systems
    runs-on: ubuntu-latest
    needs: health-check
    if: always()
    steps:
      - name: Log deploy event to Supabase
        run: |
          curl -X POST "$SUPABASE_URL/rest/v1/system_events" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"event_type\": \"deployment\",
              \"payload\": {
                \"sha\": \"${{ github.sha }}\",
                \"status\": \"${{ needs.health-check.result }}\",
                \"actor\": \"${{ github.actor }}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }
            }"

      - name: Update Notion deploy status
        run: |
          curl -X PATCH \
            "https://api.notion.com/v1/pages/$NOTION_DEPLOY_PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"properties\": {
                \"Last Deploy\": {\"date\": {\"start\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}},
                \"Deploy SHA\": {\"rich_text\": [{\"text\": {\"content\": \"${{ github.sha }}\"}}]},
                \"Status\": {\"select\": {\"name\": \"${{ needs.health-check.result == 'success' && 'Live' || 'Failed' }}\"}}
              }
            }"

      - name: Create Linear incident if deploy failed
        if: needs.health-check.result == 'failure'
        run: |
          curl -X POST "https://api.linear.app/graphql" \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { issueCreate(input: { title: \\\"🚨 Deploy Failed — ${{ github.sha }}\\\", teamId: \\\"YOUR_TEAM_ID\\\", priority: 1 }) { success } }\"
            }"
