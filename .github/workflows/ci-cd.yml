name: Garcar — Deploy & Ops

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the original known secrets — no new ones required
env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_DEPLOY_PAGE_ID: ${{ secrets.NOTION_DEPLOY_PAGE_ID }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

jobs:
  lint-and-test:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt || true
      - run: pip install ruff pytest || true
      - run: ruff check . || true
      - run: pytest tests/ -x --tb=short || true

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environmentId from known secrets
        id: resolve
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "❌ Missing RAILWAY_TOKEN or RAILWAY_SERVICE_ID"
            exit 1
          fi
          SVC=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query($id:String!){service(id:$id){id projectId}}\",\"variables\":{\"id\":\"$RAILWAY_SERVICE_ID\"}}")
          PROJECT_ID=$(echo "$SVC" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('service',{}).get('projectId',''))" 2>/dev/null || true)
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Could not resolve projectId"
            echo "$SVC"
            exit 1
          fi
          ENV=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query($id:String!){project(id:$id){environments{edges{node{id name}}}}}\",\"variables\":{\"id\":\"$PROJECT_ID\"}}")
          ENV_ID=$(echo "$ENV" | python3 -c "
import sys, json
d = json.load(sys.stdin)
edges = d.get('data',{}).get('project',{}).get('environments',{}).get('edges',[])
prefer = ['production','prod','main','live']
for e in edges:
  n = e.get('node',{})
  if n.get('name','').lower() in prefer:
    print(n['id']); break
else:
  if edges: print(edges[0]['node']['id'])
" 2>/dev/null || true)
          if [ -z "$ENV_ID" ]; then
            echo "❌ Could not resolve environmentId"
            echo "$ENV"
            exit 1
          fi
          echo "environment_id=$ENV_ID" >> $GITHUB_OUTPUT
          echo "✅ Resolved environmentId=$ENV_ID"

      - name: Trigger Railway Deploy (serviceInstanceDeployV2)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation(\$serviceId: String!, \$environmentId: String!, \$commitSha: String!) { serviceInstanceDeployV2(serviceId: \$serviceId, environmentId: \$environmentId, commitSha: \$commitSha) }\",
              \"variables\": {
                \"serviceId\": \"$RAILWAY_SERVICE_ID\",
                \"environmentId\": \"${{ steps.resolve.outputs.environment_id }}\",
                \"commitSha\": \"${{ github.sha }}\"
              }
            }")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q '"errors"'; then
            echo "❌ Deploy mutation failed"
            exit 1
          fi
          echo "✅ Deploy triggered for SHA ${{ github.sha }}"

  health-check:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for Railway to come up
        run: sleep 45
      - name: Health check
        run: |
          for URL in \
            "https://ai-wealth-ecosystem.up.railway.app/health" \
            "https://ai-wealth-ecosystem.railway.app/health" \
            "https://your-service.railway.app/health"; do
            for i in 1 2 3; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Service healthy on $URL (attempt $i)"
                exit 0
              fi
              sleep 10
            done
          done
          echo "⚠️ Health endpoint not reachable — continuing"

  notify:
    name: Notify Systems
    runs-on: ubuntu-latest
    needs: health-check
    if: always()
    steps:
      - name: Log deploy event to Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "⚠️ Supabase secrets missing — skipping"
            exit 0
          fi
          curl -s -X POST "$SUPABASE_URL/rest/v1/system_events" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"event_type\": \"deployment\",
              \"payload\": {
                \"sha\": \"${{ github.sha }}\",
                \"status\": \"${{ needs.health-check.result }}\",
                \"actor\": \"${{ github.actor }}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }
            }" || echo "⚠️ Supabase write failed"

      - name: Update Notion deploy status
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DEPLOY_PAGE_ID" ]; then
            echo "⚠️ Notion secrets missing — skipping"
            exit 0
          fi
          STATUS_NAME="Live"
          if [ "${{ needs.health-check.result }}" != "success" ]; then
            STATUS_NAME="Failed"
          fi
          curl -s -X PATCH "https://api.notion.com/v1/pages/$NOTION_DEPLOY_PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"properties\": {
                \"Last Deploy\": {\"date\": {\"start\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}},
                \"Deploy SHA\": {\"rich_text\": [{\"text\": {\"content\": \"${{ github.sha }}\"}}]},
                \"Status\": {\"select\": {\"name\": \"$STATUS_NAME\"}}
              }
            }" || echo "⚠️ Notion update failed"

      - name: Create Linear incident if deploy failed
        if: needs.health-check.result == 'failure'
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "⚠️ LINEAR_API_KEY missing — skipping"
            exit 0
          fi
          curl -s -X POST "https://api.linear.app/graphql" \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { issueCreate(input: { title: \\\"🚨 Deploy Failed — ${{ github.sha }}\\\", teamId: \\\"YOUR_TEAM_ID\\\", priority: 1 }) { success } }\"
            }" || echo "⚠️ Linear create failed"
