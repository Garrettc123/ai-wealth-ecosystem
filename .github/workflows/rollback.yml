name: Railway Rollback Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Rollback mode'
        required: true
        type: choice
        options:
          - commit-sha
          - deployment-id
        default: commit-sha
      sha:
        description: 'Git commit SHA (for commit-sha mode)'
        required: false
      deployment_id:
        description: 'Railway deployment ID (for deployment-id mode)'
        required: false
      skip_health_check:
        description: 'Skip post-rollback health check'
        required: false
        type: boolean
        default: false

# Only the original known secrets — no new ones required
env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_DEPLOY_PAGE_ID: ${{ secrets.NOTION_DEPLOY_PAGE_ID }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

jobs:
  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs & core secrets
        run: |
          if [ "${{ github.event.inputs.mode }}" = "commit-sha" ] && [ -z "${{ github.event.inputs.sha }}" ]; then
            echo "❌ commit-sha mode requires a SHA"
            exit 1
          fi
          if [ "${{ github.event.inputs.mode }}" = "deployment-id" ] && [ -z "${{ github.event.inputs.deployment_id }}" ]; then
            echo "❌ deployment-id mode requires a deployment_id"
            exit 1
          fi
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "❌ Missing required secrets: RAILWAY_TOKEN, RAILWAY_SERVICE_ID"
            exit 1
          fi
          echo "✅ Inputs and core secrets validated"

      - name: Resolve Railway environmentId from known secrets
        id: resolve
        if: github.event.inputs.mode == 'commit-sha'
        run: |
          # 1. Get projectId from service
          SVC=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query($id:String!){service(id:$id){id projectId}}\",\"variables\":{\"id\":\"$RAILWAY_SERVICE_ID\"}}")
          PROJECT_ID=$(echo "$SVC" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('service',{}).get('projectId',''))" 2>/dev/null || true)
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Could not resolve projectId from service"
            echo "$SVC"
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

          # 2. Get environments for project, prefer production/prod/main
          ENV=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query($id:String!){project(id:$id){environments{edges{node{id name}}}}}\",\"variables\":{\"id\":\"$PROJECT_ID\"}}")
          ENV_ID=$(echo "$ENV" | python3 -c "
import sys, json
d = json.load(sys.stdin)
edges = d.get('data',{}).get('project',{}).get('environments',{}).get('edges',[])
prefer = ['production','prod','main','live']
for e in edges:
  n = e.get('node',{})
  if n.get('name','').lower() in prefer:
    print(n['id']); break
else:
  if edges: print(edges[0]['node']['id'])
" 2>/dev/null || true)
          if [ -z "$ENV_ID" ]; then
            echo "❌ Could not resolve environmentId"
            echo "$ENV"
            exit 1
          fi
          echo "environment_id=$ENV_ID" >> $GITHUB_OUTPUT
          echo "✅ Resolved environmentId=$ENV_ID"

      - name: Rollback via commit SHA
        if: github.event.inputs.mode == 'commit-sha'
        run: |
          echo "🔄 Deploying commit ${{ github.event.inputs.sha }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation(\$serviceId: String!, \$environmentId: String!, \$commitSha: String!) { serviceInstanceDeployV2(serviceId: \$serviceId, environmentId: \$environmentId, commitSha: \$commitSha) }\",
              \"variables\": {
                \"serviceId\": \"$RAILWAY_SERVICE_ID\",
                \"environmentId\": \"${{ steps.resolve.outputs.environment_id }}\",
                \"commitSha\": \"${{ github.event.inputs.sha }}\"
              }
            }")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q '"errors"'; then
            echo "❌ Rollback mutation failed"
            exit 1
          fi
          echo "✅ Commit-based deploy triggered"

      - name: Rollback via deployment ID
        if: github.event.inputs.mode == 'deployment-id'
        run: |
          echo "🔄 Rolling back to deployment ${{ github.event.inputs.deployment_id }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation(\$id: String!) { deploymentRollback(id: \$id) { id } }\",
              \"variables\": {
                \"id\": \"${{ github.event.inputs.deployment_id }}\"
              }
            }")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ] || echo "$BODY" | grep -q '"errors"'; then
            echo "❌ deploymentRollback failed"
            exit 1
          fi
          echo "✅ Deployment rollback triggered"

      - name: Wait for Railway to stabilize
        run: sleep 45

      - name: Health check
        id: health
        if: github.event.inputs.skip_health_check != 'true'
        run: |
          # Prefer public domain discovery later; for now try common patterns or skip cleanly
          for URL in \
            "https://ai-wealth-ecosystem.up.railway.app/health" \
            "https://ai-wealth-ecosystem.railway.app/health" \
            "https://your-service.railway.app/health"; do
            for i in 1 2 3; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed on $URL (attempt $i)"
                exit 0
              fi
              sleep 10
            done
          done
          echo "⚠️ Health endpoint not reachable — continuing (set RAILWAY public domain if needed)"
          # Do not fail the whole rollback solely on health if URL unknown

      - name: Log rollback to Supabase
        if: always()
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "⚠️ Supabase secrets missing — skipping event log"
            exit 0
          fi
          STATUS="${{ steps.health.outcome }}"
          [ -z "$STATUS" ] && STATUS="skipped"
          curl -s -X POST "$SUPABASE_URL/rest/v1/system_events" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"event_type\": \"rollback\",
              \"payload\": {
                \"mode\": \"${{ github.event.inputs.mode }}\",
                \"sha\": \"${{ github.event.inputs.sha }}\",
                \"deployment_id\": \"${{ github.event.inputs.deployment_id }}\",
                \"status\": \"$STATUS\",
                \"actor\": \"${{ github.actor }}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }
            }" || echo "⚠️ Supabase write failed"

      - name: Update Notion
        if: always()
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DEPLOY_PAGE_ID" ]; then
            echo "⚠️ Notion secrets missing — skipping"
            exit 0
          fi
          STATUS_NAME="Rolled Back"
          if [ "${{ steps.health.outcome }}" = "failure" ]; then
            STATUS_NAME="Rollback Failed"
          fi
          curl -s -X PATCH "https://api.notion.com/v1/pages/$NOTION_DEPLOY_PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"properties\": {
                \"Last Deploy\": {\"date\": {\"start\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}},
                \"Deploy SHA\": {\"rich_text\": [{\"text\": {\"content\": \"${{ github.event.inputs.sha || github.event.inputs.deployment_id }}\"}}]},
                \"Status\": {\"select\": {\"name\": \"$STATUS_NAME\"}}
              }
            }" || echo "⚠️ Notion update failed"
